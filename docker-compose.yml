services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      - DOMAIN=${DOMAIN}
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED:-false}
      - ROCKET_PORT=80
      - WEBSOCKET_ENABLED=true
      - TZ=${TZ:-America/Mexico_City}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8080:80" # <-- Esto es vital. Solo acepta tráfico local del túnel Cloudflare
